<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --user-msg: #2563eb;
            --bot-msg: #e5e7eb;
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-card {
            width: 100%;
            max-width: 440px;
            height: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #f0f0f0;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .chat-header p {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        #chatbox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.bot p { margin-bottom: 8px; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot ul, .message.bot ol { margin-left: 18px; margin-bottom: 8px; }
        .message.bot code { background: #d1d5db; padding: 2px 4px; border-radius: 4px; font-family: monospace; }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: var(--card-bg);
            border-top: 1px solid #f0f0f0;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--primary);
        }

        .input-area button {
            padding: 0 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-area button:hover {
            background-color: var(--primary-hover);
        }

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #6b7280;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <h2>Tripsync's Chatbot</h2>
            <p>Online</p>
        </div>

        <div id="chatbox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById("userInput");

        inputField.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        async function sendMessage() {
            const chatbox = document.getElementById("chatbox");
            const userText = inputField.value.trim();
            if (!userText) return;

            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.textContent = userText;
            chatbox.appendChild(userMsgDiv);

            inputField.value = "";
            inputField.disabled = true;

  
            const typingId = "typing-" + Date.now();
            const botMsgDiv = document.createElement("div");
            botMsgDiv.className = "message bot";
            botMsgDiv.id = typingId;
            botMsgDiv.innerHTML = `<span class="typing-indicator"><span></span><span></span><span></span></span>`;
            chatbox.appendChild(botMsgDiv);
            
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText })
                });
                
                if (!response.ok) throw new Error("Request failed");
                
                const data = await response.json();
                
                const parsedContent = marked.parse(data.response);
                document.getElementById(typingId).innerHTML = parsedContent;

            } catch (err) {
                document.getElementById(typingId).textContent = "Sorry, something went wrong.";
            } finally {
                inputField.disabled = false;
                inputField.focus();
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        }
    </script>
</body>
</html>
